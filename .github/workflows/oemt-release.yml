# OEmt.club release: push a tag like v0.2.0 (matching oemt/VERSION) and this builds, tests and
# publishes oemt-club-v0.2.0-windows-x86_64.zip as a GitHub release. Installed copies of OEmt.club
# built with this repo as their OEMT_RELEASES_REPO pick it up through the self-updater.
name: OEmt.club release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches oemt/VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content oemt/VERSION -TotalCount 1).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Tag ${{ github.ref_name }} does not match oemt/VERSION ($version)" }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build, test and package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File oemt/scripts/build.ps1 -ReleasesRepo "${{ github.repository }}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/oemt-club-${{ github.ref_name }}-windows-x86_64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          gh release create "${{ github.ref_name }}" $zip --title "OEmt.club ${{ github.ref_name }}" --generate-notes

      - name: Keep build output (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: oemt-club-windows-x86_64
          path: dist/*.zip
